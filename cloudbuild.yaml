steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-management-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-management-backend:latest'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-management-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-management-backend:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stock-management-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stock-management-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '120s'

images:
  - 'gcr.io/$PROJECT_ID/stock-management-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stock-management-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
